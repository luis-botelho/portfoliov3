<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ilustração editorial de campos modulares e navegação por etapas">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d120f"/>
      <stop offset="1" stop-color="#151d18"/>
    </linearGradient>
    <radialGradient id="brilho" cx="68%" cy="46%" r="55%">
      <stop offset="0" stop-color="#7f9b76" stop-opacity=".16"/>
      <stop offset="1" stop-color="#7f9b76" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="painel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2820"/>
      <stop offset="1" stop-color="#151d18"/>
    </linearGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f3f0e8" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="gra" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#fundo)"/>
  <rect width="1600" height="900" fill="url(#grade)"/>
  <rect width="1600" height="900" fill="url(#brilho)"/>

